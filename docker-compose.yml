
services:
  postgres-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kandypack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./database/kandypack_updated.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kandypack"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - kandypack-network

  backend:
    build:
      context: ./kandypackbackend/kandypackbackend
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/kandypack
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    networks:
      - kandypack-network

  frontend:
    build:
      context: ./kandypack-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - kandypack-network

volumes:
  pgdata:

networks:
  kandypack-network:
    driver: bridge
