services:

  postgres-db:
    image: postgres:18-alpine
    container_name: kandypack_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: kandypack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${KANDYPACK_DB_PASSWORD:?Set KANDYPACK_DB_PASSWORD in the root .env}

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql
      - ./database/docker-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/migrations:/opt/kandypack-migrations:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kandypack"]
      interval: 5s
      timeout: 5s
      retries: 12

    networks:
      - kandypack_network


  backend:
    build:
      context: ./kandypackbackend
      dockerfile: Dockerfile

    container_name: kandypack_backend
    restart: unless-stopped

    depends_on:
      postgres-db:
        condition: service_healthy

    environment:
      DB_HOST: postgres-db
      DB_PASSWORD: ${KANDYPACK_DB_PASSWORD:?Set KANDYPACK_DB_PASSWORD in the root .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate

    ports:
      - "127.0.0.1:18081:8081"

    networks:
      - kandypack_network


  frontend:
    build:
      context: ./kandypack-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:18081

    container_name: kandypack_frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "3000:3000"

    networks:
      - kandypack_network


volumes:
  pgdata:


networks:
  kandypack_network:
    driver: bridge
